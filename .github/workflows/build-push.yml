name: Build and Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: blue-green-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      AWS_PAGER: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check configuration
        run: |
          set -euo pipefail
          test -n "$AWS_REGION"
          test -n "$ECR_REPOSITORY"
          test -n "$EC2_INSTANCE_ID"

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account --output text)

          REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$REGISTRY"

          IMAGE_TAG="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "IMAGE_URI=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE_URI" .

      - name: Test container readiness
        run: |
          set -euo pipefail
          trap 'docker logs smoke-test; docker rm -f smoke-test' EXIT

          docker run -d --name smoke-test \
            -p 127.0.0.1:8080:8000 \
            -e APP_VERSION="$GITHUB_SHA" \
            -e GIT_COMMIT="$GITHUB_SHA" \
            -e DEPLOYMENT_SLOT=blue \
            "$IMAGE_URI"

          READY=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 \
              http://127.0.0.1:8080/ready |
              jq -e '.status == "ready"' >/dev/null; then
              READY=true
              break
            fi
            sleep 2
          done

          if [ "$READY" != true ]; then
            echo "Container failed readiness checks."
            exit 1
          fi

          curl --fail --silent --max-time 5 \
            http://127.0.0.1:8080/version |
            jq -e --arg commit "$GITHUB_SHA" \
              '.commit == $commit and .slot == "blue"'

      - name: Push image to ECR
        run: docker push "$IMAGE_URI"

      - name: Write image summary
        run: |
          echo "### Image pushed successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to EC2 through SSM
        timeout-minutes: 18
        run: |
          set -euo pipefail

          DEPLOY_COMMAND="bash /opt/aws-blue-green/deploy.sh '$IMAGE_URI' '$GITHUB_SHA'"

          jq -n --arg command "$DEPLOY_COMMAND" \
            '{commands: [$command], executionTimeout: ["600"]}' \
            > ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-parameters.json \
            --timeout-seconds 60 \
            --comment "GitHub blue-green deployment" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command: $COMMAND_ID"
          echo "SSM command: $COMMAND_ID" >> "$GITHUB_STEP_SUMMARY"

          for attempt in $(seq 1 180); do
            if aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --output json \
              > ssm-result.json 2> ssm-error.txt; then

              STATUS=$(jq -r '.Status' ssm-result.json)
              echo "Deployment status: $STATUS"

              case "$STATUS" in
                Success)
                  jq -r '.StandardOutputContent, .StandardErrorContent' \
                    ssm-result.json
                  echo "### EC2 deployment succeeded" >> "$GITHUB_STEP_SUMMARY"
                  echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                  ;;
                Failed|Cancelled|TimedOut)
                  jq -r '.StandardOutputContent, .StandardErrorContent' \
                    ssm-result.json
                  echo "### EC2 deployment failed: $STATUS" >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                  ;;
              esac
            else
              if ! grep -q "InvocationDoesNotExist" ssm-error.txt; then
                cat ssm-error.txt
                exit 1
              fi
            fi

            sleep 5
          done

          echo "Stopped waiting. Check SSM command $COMMAND_ID in AWS."
          exit 1
