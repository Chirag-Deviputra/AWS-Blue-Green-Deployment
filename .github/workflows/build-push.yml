name: Build and Push to ECR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$REGISTRY"

          IMAGE_TAG="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "IMAGE_URI=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Build image
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE_URI" .

      - name: Test container readiness
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs smoke-test; docker rm -f smoke-test' EXIT

          docker run -d --name smoke-test \
            -p 127.0.0.1:8080:8000 \
            -e APP_VERSION="$GITHUB_SHA" \
            -e GIT_COMMIT="$GITHUB_SHA" \
            -e DEPLOYMENT_SLOT=blue \
            "$IMAGE_URI"

          READY=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 \
              http://127.0.0.1:8080/ready; then
              READY=true
              break
            fi
            sleep 2
          done

          if [ "$READY" != true ]; then
            echo "Container failed readiness checks."
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:8080/version |
            jq -e --arg commit "$GITHUB_SHA" \
              '.commit == $commit and .slot == "blue"'

      - name: Push image to ECR
        run: docker push "$IMAGE_URI"

      - name: Write summary
        run: |
          echo "### Image pushed successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "$IMAGE_URI" >> "$GITHUB_STEP_SUMMARY"